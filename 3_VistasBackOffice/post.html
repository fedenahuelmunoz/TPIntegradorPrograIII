<!--Etiqueta raíz <html>-->
<html lang="en">

<!--En el <head> ponemos la información no visible del Back Office incluyendo la metadata, links, etc.-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--Título principal de la página principal del Back Office-->
    <title>Back Office - Crear</title>

    <!--Aca apuntamos al favicon de la empresa-->
    <link rel="shortcut icon" href="img/fravega-icon.jpg" type="jpg">

    <!--Aca apuntamos a nuestra archivo CSS para darle estilos a nuestra página web-->
    <link rel="stylesheet" href="css/styles.css">

    <!--Aca hay que ponder el script para importar el archivo con código JavaScript para la página-->
    <!--<script defer src="/proyectoGrupal/TPIntegradorPrograIII/3_VistasBackOffice/index.js"></script>-->
</head>

<!--En el <body> disponemos los elementos visuales de la página principal del Back Office (es decir, las etiquetas HTML)-->
<body>
    <!--Cabecera del Back Office-->
    <header class="back-office-header" id="encabezado">
        <div class="logo-container">
            <img class="logo" src="./img/logo-fravesta.jpg" alt="logo-empresa-fravesta">
        </div>
        
        <!--Esta es la barra de navegación del sitio web-->
        <nav class="header-nav">
            <ul>
                <!--Opciones de nuestra barra de navegación-->
                <li class="ul-header">
                    <a href="index.html">Principal</a> 
                </li>
                <li class="ul-header">
                    <a href="get.html">Obtener</a>
                </li>
                <li class="ul-header">
                    <a href="post.html">Crear</a>
                </li>
                <li class="ul-header">
                    <a href="put.html">Modificar</a>
                </li>
                <li class="ul-header">
                    <a href="delete.html">Eliminar</a>
                </li>
            </ul>
        </nav>
    </header>

    <!--Sector principal de nuestro sitio del Back Office-->
    <main>

        <!--Formulario para pedir obtener un producto en base a un id-->
        <section class="createProduct-container">

            <!--Especie de cabecera del formulario-->
            <div id="cabecera-formulario">
                <h3>Crear producto</h3>
            </div>
            
            <!--Formulario propiamente dicho para crear un nuevo producto-->
            <form id="createProductForm">

                <label for="categoryProd">Categoria</label>
                <select name="category" id="categoryProd" required>
                    <option value="notebook">Notebook</option>
                    <option value="cellphone">Celular</option>
                </select>

                <label for="imageProd">Imagen</label>
                <input type="text" name="image" id="imageProd" required>

                <label for="nameProd">Nombre</label>
                <input type="text" name="name" id="nameProd" required>

                <label for="priceProd">Precio</label>
                <input type="number" name="price" id="priceProd" min="1" required>

                <input type="submit" value="Crear producto">

            </form>
        </section>
        
        <!--Contenedor para los productos, en este caso, el producto cuyo id coincide con el ingresado-->
        <section id="contenedor-productos"></section>
    </main>

     <!--Pie de página del sitio web-->
    <footer>
        <!--Este es el logo de la empresa-->
        <div class="img-container">
            <img src="./img/logo-fravesta.jpg" alt="Logo de Fravesta" id="logo-empresa-footer">
        </div>

        <p>Una empresa de Federico Muñoz y Miguel Godoy</p>
    </footer>

    <script>
        const urlBase = "http://localhost:3000";
        const contenedorProductos = document.getElementById("contenedor-productos");
        const getProductForm = document.getElementById("getProductForm");
        const createProductForm = document.getElementById("createProductForm");

        // Optimización: validación previa de los datos en el cliente.
        function validarFormulario(data) {
            const errores = [];

            if (!data.name || !data.price || !data.image || !data.category) {
                errores.push("Faltan campos requeridos");
            }

            // Validamos el campo name
            if (data.name.length < 2) {
                errores.push("El nombre del producto tener al menos dos caracteres");
            }

            // Validamos el campo price
            if (data.price <= 0) {
                errores.push("El precio debe ser un número entero mayor a cero");
            }

            return errores;
        }

        function mostrarMensaje(tipo, mensaje){
            //Tarea: darle formato al parrafo que indica el error
            contenedorProductos.innerHTML = `
                <p class="mensaje ${tipo}">${mensaje}</p>
            `;
        }

        function mostrarListaErrores(array) {
            let htmlErrores = "";
            array.forEach(error => {
                htmlErrores += `<p class="mensaje error">${error}</p>`;
            });

            contenedorProductos.innerHTML = htmlErrores;
        }

        createProductForm.addEventListener("submit", async event => {
            
            event.preventDefault(); // Evitamos el envio por defecto del <form>

            // Obtenemos todo el contenido del <form> en un objeto FormData
            const formData = new FormData(event.target);
            console.log(formData); 
            // FormData(4) { category → "drink", image → "urlcualca", name → "Fernet Chabona", price → "12345" }

            // Creamos un objeto literal de JavaScript para poder parsearlo en JSON y meterlo en el cuerpo de la peticion HTTP
            const formObj = Object.fromEntries(formData.entries());
            console.log(formObj); 
            // {category: 'food', image: 'https://comedera.com/wp-content/uploads/sites/9/20…08/Chipa.jpg?fit=150,125&crop=0px,0px,150px,150px', name: 'Cono de papas fritas', price: '12345'}
            
            // Optimización: parseamos algunos valores del formObj
            formObj.price = Number(formObj.price); // Mandamos price como número
            formObj.name = formObj.name.trim(); // Al campo name le quitamos los espacios

            // Como los datos ahora están más limpios, los puedo pasar a la función validadora del cliente.
            const errores = validarFormulario(formObj);

            // Verificamos que no haya datos errroneos antes de enviar algo al servidor
            if (errores.length > 0) {
                console.error(errores);
                return mostrarListaErrores(errores);
            }

            // TO DO, mandar price como número
            // Limpiamos de espacio el campo name
            
            // Este es el contenido que ira en el body de la request
            console.log(JSON.stringify(formObj)); 
            // {"category":"food","image":"https://comedera.com/wp-content/uploads/sites/9/2023/08/Chipa.jpg?fit=150,125&crop=0px,0px,150px,150px","name":"Cono de papas fritas","price":"12345"}

            try {
                const response = await fetch(`${urlBase}/api/products`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(formObj)
                });

                console.log(response);

                const data = await response.json(); // Ahora podre acceder al contenido de la respuesta

                if (!response.ok) {
                    if (data.listaErrores) {
                        return mostrarListaErrores(data.listaErrores);
                    }

                    return mostrarMensaje("error", data.message);
                }

                let mensaje = `${data.message} con id ${data.productId}`;

                console.log(mensaje);
                mostrarMensaje("exito", mensaje);

            } catch (error) {
                // Estos errores son errores REALES de red, no capturan 404, 500, etc
                console.error("Error al obtener productos: ", error);
                return mostrarMensaje("error", "Error de conexión con el servidor");

            }

    });

    </script>   
    
</body>
</html>
