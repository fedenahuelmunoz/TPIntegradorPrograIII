<!DOCTYPE html>

<!--Etiqueta raíz <html>-->
<html lang="en">

<!--En el <head> ponemos la información no visible incluyendo la metadata, links, etc.-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!--Este es el título de la página web-->
    <title>Frávesta-Ingreso</title>

    <!--Importamos aca el favincon de Frávesta-->
    <link rel="shortcut icon" href="img/fravega-icon.jpg" type="jpg">
    
    <!--Aca apuntamos a nuestra archivo CSS para darle estilos a nuestra página web-->
    <link rel="stylesheet" href="styles.css">
    
    <!--Importamos nuestro código de JavaScript para este proyecto-->
    <script defer src="front.js"></script>
</head>

<!--En el <body> disponemos los elementos visuales de nuestra página web (es decir, las etiquetas HTML)-->
<body>

    <header class="site-header" id="encabezado-login">
        <div class="img-container">
            <img class="logo" src="img/logo-fravesta.jpg" alt="logo-empresa-fravesta">
        </div>
    </header>

    <main class="main-login">
        <h3 class="cabecera-form-login">Formulario de ingreso para el cliente</h3>
        <!--method: indica que tipo de peticion HTTP va a hacer , una peticion POST-->
        <!--action: indica a que URL se hace esa peticion-->

        <form class="form-login" id="form-cliente" action="/login" method="POST" >

            <label for="name">Nombre:</label>
            <input type="text" name="name" id="name" required>

            <input type="submit" value="Ingresar" class="btn-log" id="login-dashboard-btn">
        </form>
    </main>

    <script>
        // Código JavaScript para el formulario de bienvenida para el ciente
        let formBienvenida = document.getElementById("form-cliente");
        formBienvenida.addEventListener("submit", event => {
            event.preventDefault();

            let nombreUsuario = document.getElementById("name").value;

            if (nombreUsuario.length > 0){
                sessionStorage.setItem("nombreUsuario", nombreUsuario);
                window.location.href = "index.html"
            }
        })

    </script>
    
</body>
